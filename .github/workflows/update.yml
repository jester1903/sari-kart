name: Haftalık Veri Güncelleme
 
on:
  schedule:
    - cron: '0 18 * * *'  # Her gün saat 21:00 TR (UTC+3 = 18:00 UTC)
  workflow_dispatch:        # Manuel tetikleme butonu
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
 
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: requests kütüphanesi kur
        run: pip install requests
 
      - name: Veriyi güncelle
        run: python update_data.py
 
      - name: Değişiklik var mı kontrol et
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
 
      - name: Güncellemeyi commit et
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Otomatik veri güncellemesi - $(date '+%d.%m.%Y')"
          git push
